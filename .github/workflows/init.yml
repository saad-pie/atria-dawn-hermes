name: 📦 Atria Init & Cache Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  initialize-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Node Modules, Pip, and Hermes Environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            ~/.cache/pip
            ~/.hermes
          key: ${{ runner.os }}-atria-hermes-full-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-atria-hermes-full-cache-

      - name: Install Node Dependencies & Official Hermes CLI
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi
          
          # Force install if hermes executable doesn't exist yet in cache
          if [ ! -f "$HOME/.hermes/bin/hermes" ] && [ ! -f "$HOME/.hermes/venvs/hermes-dev/bin/hermes" ]; then
            echo "📥 Installing Official Hermes Agent CLI..."
            curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash
          else
            echo "⚡ Cached Hermes installation found!"
          fi
          
          # Ensure local bin is exposed and executable
          ls -la ~/.hermes || true
          
          echo "✨ Environment, Hermes CLI, and caches fully initialized successfully!"
          
