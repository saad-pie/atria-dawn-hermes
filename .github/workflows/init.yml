name: 📦 Atria Init & Cache Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  initialize-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone Hermes Agent Repo & Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            ~/.cache/pip
            hermes-core
          key: ${{ runner.os }}-atria-hermes-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-atria-hermes-cache-

      - name: Setup & Install Core Packages
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi
          # Clone Hermes core if not already restored from cache
          if [ ! -d "hermes-core" ]; then
            git clone https://github.com/NousResearch/Hermes-Agent.git hermes-core
          fi
          pip install openai requests tenacity
          echo "✨ Environment, Hermes Agent core, and caches initialized successfully!"
          
