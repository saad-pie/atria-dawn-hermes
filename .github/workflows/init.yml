name: 📦 Atria Init & Cache Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  initialize-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node Modules & Pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-atria-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-atria-cache-

      - name: Install Dependencies
        run: |
          npm install
          echo "✨ Environment initialized and cached successfully!"
          
