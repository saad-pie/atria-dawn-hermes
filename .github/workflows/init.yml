name: 📦 Atria Init & Cache Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  initialize-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Node Modules, Pip, and Hermes Environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            ~/.cache/pip
            ~/.hermes
            .hermes-repo
          key: ${{ runner.os }}-atria-hermes-full-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-atria-hermes-full-cache-

      - name: Install Node Dependencies & Official Hermes CLI & Sync to Repo
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi
          
          # If a local repo copy exists from cache, restore it to ~/.hermes first
          if [ -d ".hermes-repo" ] && [ ! -d "$HOME/.hermes" ]; then
            mkdir -p ~/.hermes
            cp -r .hermes-repo/* ~/.hermes/ 2>/dev/null || true
          fi
          
          # Check if Hermes exists in cache or tracked repo folder
          HERMES_EXISTS=false
          if [ -f "$HOME/.hermes/bin/hermes" ] || [ -f ".hermes-repo/bin/hermes" ]; then
            HERMES_EXISTS=true
            echo "⚡ Hermes installation already exists!"
          fi
          
          # If it doesn't exist anywhere, install it fresh!
          if [ "$HERMES_EXISTS" = false ]; then
            echo "📥 Installing Official Hermes Agent CLI..."
            curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash
          fi
          
          # Source bashrc / profile to load hermes into PATH as requested by the installer
          if [ -f "$HOME/.bashrc" ]; then
            source "$HOME/.bashrc"
          fi
          export PATH="$HOME/.hermes/bin:$PATH"
          
          # Mirror ~/.hermes into tracked repo folder for git commit
          mkdir -p .hermes-repo
          cp -r ~/.hermes/* .hermes-repo/ 2>/dev/null || true
          
          # Configure Git credentials for auto-commit
          git config --global user.name "Atria-Dawn Bot"
          git config --global user.email "bot@atria-dawn.ai"
          
          # Add files and check if commit is needed
          git add .hermes-repo node_modules package-lock.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "✨ No new changes to commit. Hermes and dependencies are already fully tracked!"
          else
            echo "🚀 Hermes was missing or updated. Committing and pushing back to repo via GIT_PAT..."
            git commit -m "📦 Auto-commit: Initialize and cache Hermes CLI binaries [skip ci]"
            git push origin main
            echo "🎉 Successfully pushed Hermes environment to your GitHub repository!"
          fi
          
          echo "✨ Environment, Hermes CLI, and caches fully initialized successfully!"
          
