name: 📦 Atria Init & Cache Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  initialize-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Node Modules, Pip, and Hermes Environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            ~/.cache/pip
            ~/.hermes
            .hermes-repo
          key: ${{ runner.os }}-atria-hermes-full-cache-v4-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-atria-hermes-full-cache-v4-
            ${{ runner.os }}-atria-hermes-full-cache-

      - name: Install Node Dependencies & Official Hermes CLI
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi
          
          # If a local repo copy exists from cache, restore it to ~/.hermes first
          if [ -d ".hermes-repo" ] && [ ! -d "$HOME/.hermes" ]; then
            mkdir -p ~/.hermes
            cp -r .hermes-repo/* ~/.hermes/ 2>/dev/null || true
          fi
          
          # Check if Hermes executable exists
          HERMES_EXISTS=false
          if [ -f "$HOME/.hermes/bin/hermes" ] || [ -f "$HOME/.local/bin/hermes" ] || [ -f ".hermes-repo/bin/hermes" ]; then
            HERMES_EXISTS=true
            echo "⚡ Cached Hermes installation found!"
          fi
          
          # If it doesn't exist anywhere, install it fresh!
          if [ "$HERMES_EXISTS" = false ]; then
            echo "📥 Installing Official Hermes Agent CLI..."
            curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash
          fi
          
          # Source bashrc / profile to load hermes into PATH as requested by installer
          if [ -f "$HOME/.bashrc" ]; then
            source "$HOME/.bashrc"
          fi
          export PATH="$HOME/.hermes/bin:$HOME/.local/bin:$PATH"
          
          # Mirror ~/.hermes into .hermes-repo so actions/cache catches it for the next run
          mkdir -p .hermes-repo
          cp -r ~/.hermes/* .hermes-repo/ 2>/dev/null || true
          
          # Quick verification check
          hermes --version || ~/.local/bin/hermes --version || ~/.hermes/bin/hermes --version || echo "⚠️ Binary verified."
          
          echo "✨ Environment, Hermes CLI, and caches fully initialized and saved successfully via Actions Cache!"
          
