name: ⚡ Hermes Live Chat 4000

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt/Task for Atria-Dawn Hermes Agent'
        required: true
        type: string
      user_id:
        description: 'User or Session ID'
        required: false
        default: 'anonymous'
        type: string

jobs:
  run-hermes-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore/Ensure Dependencies & Hermes Core
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            hermes-core
          key: ${{ runner.os }}-atria-hermes-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-atria-hermes-cache-

      - name: Install Runtime Requirements & Hermes Core Deps
        run: |
          pip install openai requests tenacity
          if [ -f "hermes-core/requirements.txt" ]; then
            pip install -r hermes-core/requirements.txt || true
          fi

      - name: Run Hermes Agent
        env:
          ATRIA_DAWN_API_KEY: ${{ secrets.ATRIA_DAWN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.ATRIA_DAWN_API_KEY }}
          OPENAI_BASE_URL: "https://api.atria-asi.ai/v1"
          HERMES_MODEL: "Atria-Dawn-Preview"
        run: |
          python3 hermes-core/src/hermes_agent.py \
            --prompt "${{ inputs.prompt }}" \
            --model "$HERMES_MODEL" \
            --user-id "${{ inputs.user_id }}"
            
