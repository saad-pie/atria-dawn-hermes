name: ⚡ Hermes Live Chat 4000

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt/Task for Atria-Dawn Hermes Agent'
        required: true
        type: string
      user_id:
        description: 'User or Session ID'
        required: false
        default: 'anonymous'
        type: string
      callback_url:
        description: 'Optional Vercel webhook URL to report results back'
        required: false
        default: ''
        type: string

jobs:
  run-hermes-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Pre-Cached Hermes Environment & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            ~/.cache/pip
            ~/.hermes
            .hermes-repo
          key: ${{ runner.os }}-atria-hermes-full-cache-v4-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-atria-hermes-full-cache-v4-
            ${{ runner.os }}-atria-hermes-full-cache-

      - name: Run Autonomous Hermes Agent & Fallback Handler
        env:
          ATRIA_DAWN_API_KEY: ${{ secrets.ATRIA_DAWN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.ATRIA_DAWN_API_KEY }}
          OPENAI_BASE_URL: "https://api.atria-asi.ai/v1"
          HERMES_DEFAULT_MODEL: "Atria-Dawn-Preview"
          PROMPT_TEXT: "${{ inputs.prompt }}"
          USER_ID: "${{ inputs.user_id }}"
          CALLBACK_URL: "${{ inputs.callback_url }}"
        run: |
          echo "🔍 Locating Hermes environment..."
          
          PYTHON_BIN=""
          if [ -f "$HOME/.hermes/hermes-agent/venv/bin/python" ]; then
            PYTHON_BIN="$HOME/.hermes/hermes-agent/venv/bin/python"
          elif [ -f "$HOME/.hermes/venvs/hermes-dev/bin/python" ]; then
            PYTHON_BIN="$HOME/.hermes/venvs/hermes-dev/bin/python"
          else
            PYTHON_BIN="python3"
          fi
          
          echo "🚀 Executing Hermes Autonomous Agent Execution Script: $PYTHON_BIN"
          "$PYTHON_BIN" -c "
          import os
          import json
          import urllib.request
          from openai import OpenAI

          prompt = os.environ['PROMPT_TEXT']
          callback = os.environ.get('CALLBACK_URL', '').strip()
          user_id = os.environ.get('USER_ID', 'anonymous')

          answer = None
          success = False

          # Attempt 1: Run via Atria-Dawn endpoint
          print(f'🤖 Initializing Hermes Agent via Atria-Dawn endpoint ({os.environ[\"HERMES_DEFAULT_MODEL\"]})...')
          try:
              client = OpenAI(
                  api_key=os.environ['ATRIA_DAWN_API_KEY'],
                  base_url=os.environ['OPENAI_BASE_URL']
              )
              res = client.chat.completions.create(
                  model=os.environ['HERMES_DEFAULT_MODEL'],
                  messages=[
                      {
                          'role': 'system', 
                          'content': 'You are Hermes Agent 4000, powered by Atria-Dawn core logic and Nous Research agent architecture. Be exceptionally warm, helpful, and brilliant.'
                      },
                      {
                          'role': 'user', 
                          'content': prompt
                      }
                  ]
              )
              answer = res.choices[0].message.content
              success = True
              print('✅ Atria-Dawn execution successful!')
          except Exception as e:
              print(f'⚠️ Atria-Dawn endpoint failed: {e}')
              print('🔄 Falling back to keyless Opencode Zen gateway...')

          # Attempt 2: Fallback to Opencode Zen if Atria fails
          if not success:
              try:
                  zen_client = OpenAI(
                      api_key='not-needed',
                      base_url='https://opencode.zen/v1' # Keyless fallback gateway
                  )
                  res = zen_client.chat.completions.create(
                      model='zen-default',
                      messages=[
                          {
                              'role': 'system',
                              'content': 'You are Hermes Agent 4000 acting via Opencode Zen fallback infrastructure. Be exceptionally warm, helpful, and brilliant.'
                          },
                          {
                              'role': 'user',
                              'content': prompt
                          }
                      ]
                  )
                  answer = res.choices[0].message.content
                  success = True
                  print('✅ Opencode Zen fallback execution successful!')
              except Exception as zen_err:
                  print(f'❌ Opencode Zen fallback also failed: {zen_err}')
                  answer = f'⚠️ Error: Both Atria-Dawn and Opencode Zen endpoints encountered issues processing your request: {zen_err}'

          print('\n✨ === HERMES AGENT FINAL RESPONSE === ✨')
          print(answer)
          print('=======================================\n')

          # Dispatch webhook back to Vercel backend if callback URL is provided
          if callback:
              print(f'📤 Dispatching response payload back to callback URL: {callback}')
              payload = json.dumps({
                  'success': success,
                  'user_id': user_id,
                  'response': answer
              }).encode('utf-8')
              
              req = urllib.request.Request(
                  callback,
                  data=payload,
                  headers={'Content-Type': 'application/json'},
                  method='POST'
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f'✅ Callback delivered successfully with status: {resp.status}')
              except Exception as cb_err:
                  print(f'⚠️ Warning: Callback request failed: {cb_err}')
          else:
              print('ℹ️ No callback URL provided. Skipping webhook dispatch.')
          "
          
