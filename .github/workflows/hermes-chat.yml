name: ⚡ Hermes Live Chat 4000

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt/Task for Atria-Dawn Hermes Agent'
        required: true
        type: string
      user_id:
        description: 'User or Session ID'
        required: false
        default: 'anonymous'
        type: string

jobs:
  run-hermes-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Pre-Cached Hermes Environment & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            ~/.cache/pip
            ~/.hermes
            .hermes-repo
          key: ${{ runner.os }}-atria-hermes-full-cache-v4-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-atria-hermes-full-cache-v4-
            ${{ runner.os }}-atria-hermes-full-cache-

      - name: Run Atria-Dawn Hermes Agent Engine
        env:
          ATRIA_DAWN_API_KEY: ${{ secrets.ATRIA_DAWN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.ATRIA_DAWN_API_KEY }}
          OPENAI_BASE_URL: "https://api.atria-asi.ai/v1"
          HERMES_DEFAULT_MODEL: "Atria-Dawn-Preview"
          PROMPT_TEXT: "${{ inputs.prompt }}"
          USER_ID: "${{ inputs.user_id }}"
        run: |
          echo "🔍 Locating Hermes venv python..."
          
          # Find the exact python binary inside the hermes-agent venv where packages are installed
          PYTHON_BIN=""
          if [ -f "$HOME/.hermes/hermes-agent/venv/bin/python" ]; then
            PYTHON_BIN="$HOME/.hermes/hermes-agent/venv/bin/python"
          elif [ -f "$HOME/.hermes/venvs/hermes-dev/bin/python" ]; then
            PYTHON_BIN="$HOME/.hermes/venvs/hermes-dev/bin/python"
          else
            PYTHON_BIN="python3"
          fi
          
          echo "🚀 Executing script using Python interpreter: $PYTHON_BIN"
          "$PYTHON_BIN" -c "
          import os
          from openai import OpenAI
          
          client = OpenAI(
              api_key=os.environ['ATRIA_DAWN_API_KEY'],
              base_url=os.environ['OPENAI_BASE_URL']
          )
          
          print(f'🤖 Sending prompt via Atria-Dawn endpoint: {os.environ[\"HERMES_DEFAULT_MODEL\"]}')
          res = client.chat.completions.create(
              model=os.environ['HERMES_DEFAULT_MODEL'],
              messages=[
                  {
                      'role': 'system', 
                      'content': 'You are Hermes Agent 4000, powered by Atria-Dawn core logic and Nous Research agent architecture. Be exceptionally warm, helpful, and brilliant.'
                  },
                  {
                      'role': 'user', 
                      'content': os.environ['PROMPT_TEXT']
                  }
              ]
          )
          
          print('\n✨ === HERMES AGENT RESPONSE === ✨')
          print(res.choices[0].message.content)
          print('===================================\n'
          )"
          
