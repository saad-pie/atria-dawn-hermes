name: ⚡ Hermes Live Chat 4000

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt/Task for Atria-Dawn Hermes Agent'
        required: true
        type: string
      user_id:
        description: 'User or Session ID'
        required: false
        default: 'anonymous'
        type: string

jobs:
  run-hermes-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Pre-Cached Hermes Environment & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.hermes
          key: ${{ runner.os }}-atria-hermes-full-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-atria-hermes-full-cache-

      - name: Set up Hermes PATH
        run: |
          echo "$HOME/.hermes/venvs/hermes-dev/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$HOME/.hermes/venvs/hermes-dev/bin:$PATH"

      - name: Run Hermes Execution Engine
        env:
          ATRIA_DAWN_API_KEY: ${{ secrets.ATRIA_DAWN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.ATRIA_DAWN_API_KEY }}
          OPENAI_BASE_URL: "https://api.atria-asi.ai/v1"
          HERMES_DEFAULT_MODEL: "Atria-Dawn-Preview"
        run: |
          export PATH="$HOME/.hermes/venvs/hermes-dev/bin:$PATH"
          
          # Execute Hermes directly with Atria-Dawn environment variables wired in
          hermes run --prompt "${{ inputs.prompt }}" --user "${{ inputs.user_id }}"
          
