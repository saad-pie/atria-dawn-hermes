name: ⚡ Hermes Live Chat 4000

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt/Task for Atria-Dawn Hermes Agent'
        required: true
        type: string
      user_id:
        description: 'User or Session ID'
        required: false
        default: 'anonymous'
        type: string

jobs:
  run-hermes-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Official Hermes Agent CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash
          echo "$HOME/.hermes/venvs/hermes-dev/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"

      - name: Configure Atria-Dawn Provider for Hermes Agent
        env:
          ATRIA_DAWN_API_KEY: ${{ secrets.ATRIA_DAWN_API_KEY }}
        run: |
          mkdir -p ~/.hermes
          # Configure Hermes environment so it routes its autonomous agent backend to Atria-Dawn
          cat << EOF > ~/.hermes/.env
          OPENAI_API_KEY="${ATRIA_DAWN_API_KEY}"
          OPENAI_BASE_URL="https://api.atria-asi.ai/v1"
          HERMES_DEFAULT_MODEL="Atria-Dawn-Preview"
          EOF
          
          # Set model config preference
          hermes config set model custom/Atria-Dawn-Preview || true

      - name: Run Full Hermes Autonomous Agent Loop
        env:
          ATRIA_DAWN_API_KEY: ${{ secrets.ATRIA_DAWN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.ATRIA_DAWN_API_KEY }}
          OPENAI_BASE_URL: "https://api.atria-asi.ai/v1"
        run: |
          # Use Hermes agent execution command / non-interactive agent run flag 
          # to kick off its memory and reasoning loop instead of a dead chat flag
          hermes agent run --prompt "${{ inputs.prompt }}" --user "${{ inputs.user_id }}"
          
